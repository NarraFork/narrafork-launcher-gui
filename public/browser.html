<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NarraFork Launcher</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }

  /* Dark theme (default) */
  body { background: #1a1b1e; }
  #titlebar { background: #25262b; border-bottom: 1px solid #2c2e33; }
  #titlebar-title { color: #c1c2c5; }
  .titlebar-btn { color: #c1c2c5; }
  .titlebar-btn:hover { background: rgba(255,255,255,0.1); }

  /* Light theme */
  body.light { background: #ffffff; }
  body.light #titlebar { background: #f8f9fa; border-bottom: 1px solid #dee2e6; }
  body.light #titlebar-title { color: #212529; }
  body.light .titlebar-btn { color: #495057; }
  body.light .titlebar-btn:hover { background: rgba(0,0,0,0.06); }

  .titlebar-btn.close:hover { background: #e06c75 !important; color: #fff !important; }

  #titlebar {
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 8px;
    user-select: none;
    -webkit-user-select: none;
  }
  #titlebar-drag {
    flex: 1;
    height: 100%;
    display: flex;
    align-items: center;
    padding-left: 8px;
  }
  #titlebar-title {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 12px;
    font-weight: 600;
  }
  .titlebar-btns { display: flex; gap: 0; height: 100%; }
  .titlebar-btn {
    width: 46px;
    height: 100%;
    border: none;
    background: transparent;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .titlebar-btn svg { width: 14px; height: 14px; }
  #content {
    height: calc(100% - 36px);
    width: 100%;
  }
  #content iframe {
    width: 100%;
    height: 100%;
    border: none;
  }
</style>
</head>
<body>
<div id="titlebar">
  <div id="titlebar-drag">
    <span id="titlebar-title">NarraFork</span>
  </div>
  <div class="titlebar-btns">
    <button class="titlebar-btn" id="btn-min" title="Minimize">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <button class="titlebar-btn" id="btn-max" title="Maximize">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="5" width="14" height="14" rx="1"/></svg>
    </button>
    <button class="titlebar-btn close" id="btn-close" title="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>
    </button>
  </div>
</div>
<div id="content">
  <iframe id="app-frame" src="about:blank"></iframe>
</div>
<script>
  // Get params
  const params = new URLSearchParams(window.location.search);
  const targetUrl = params.get('url');
  const theme = params.get('theme');

  // Apply theme
  if (theme === 'light') {
    document.body.classList.add('light');
  }

  if (targetUrl) {
    document.getElementById('app-frame').src = targetUrl;
  }

  // Window controls via global Tauri API
  const win = window.__TAURI__?.window?.getCurrentWindow?.();
  if (win) {
    // Drag
    const drag = document.getElementById('titlebar-drag');
    drag.addEventListener('mousedown', (e) => {
      if (e.button === 0) { e.preventDefault(); win.startDragging(); }
    });
    drag.addEventListener('dblclick', async () => {
      (await win.isMaximized()) ? win.unmaximize() : win.maximize();
    });
    // Buttons
    document.getElementById('btn-min').addEventListener('click', () => win.minimize());
    document.getElementById('btn-max').addEventListener('click', async () => {
      (await win.isMaximized()) ? win.unmaximize() : win.maximize();
    });
    document.getElementById('btn-close').addEventListener('click', () => win.close());
  }
</script>
</body>
</html>
